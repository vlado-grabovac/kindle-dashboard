name: Dashboard

on:
  schedule:
    - cron: "*/15 * * * *"
    - cron: "17 3 1 * *"   # mjesecni keepalive (GitHub gasi cron nakon 60 dana bez aktivnosti)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Xiaomi token cache
        uses: actions/cache@v4
        with:
          path: .xiaomi_token.json
          key: xiaomi-token-${{ github.run_id }}
          restore-keys: xiaomi-token-
      - name: Render
        env:
          XIAOMI_USER: ${{ secrets.XIAOMI_USER }}
          XIAOMI_PASS: ${{ secrets.XIAOMI_PASS }}
          XIAOMI_PASSTOKEN: ${{ secrets.XIAOMI_PASSTOKEN }}
          XIAOMI_USERID: ${{ secrets.XIAOMI_USERID }}
          XIAOMI_DEVICEID: ${{ secrets.XIAOMI_DEVICEID }}
          XIAOMI_SERVICETOKEN: ${{ secrets.XIAOMI_SERVICETOKEN }}
          XIAOMI_SSECURITY: ${{ secrets.XIAOMI_SSECURITY }}
          XIAOMI_SERVER: ${{ vars.XIAOMI_SERVER }}
          PURIFIER_MAP: ${{ vars.PURIFIER_MAP }}
        run: python render.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4

  keepalive:
    if: github.event.schedule == '17 3 1 * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u > .keepalive
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add .keepalive
          git commit -m "keepalive" && git push || true
